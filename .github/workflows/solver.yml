name: Solver regression
on: [push, pull_request]
jobs:
  solver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m unittest discover -s tests -p test_build.py
      - run: python visualization/build.py --out runs/explorer.html
      - run: python solvers/run.py maps/elementary/demo-agents.json --max-horizon 1 --timeout-sec 5 --out runs/smoke.json
