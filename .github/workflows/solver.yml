name: Solver regression
on: [push, pull_request]
jobs:
  solver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m unittest discover -s tests -p test_build.py
      - run: python visualization/build.py --out runs/explorer.html
      - run: python solvers/run.py maps/elementary/demo-agents.json --max-horizon 1 --timeout-sec 5 --out runs/smoke.json
      - run: python solvers/run.py maps/elementary/demo-agents.json --solver lacam --timeout-sec 15 --out runs/lacam-demo.json --viewer runs/lacam-demo.html
      - run: python solvers/run.py maps/elementary/demo-agents.json --solver lacam --anytime --timeout-sec 10 --report-interval-sec 2 --out runs/lacam-anytime.json --viewer runs/lacam-anytime.html
      - run: python -c "import json; d=json.load(open('runs/lacam-anytime.json')); assert d['paths'] is not None and d['makespan'] <= 35; assert d['lower_bound'] <= d['upper_bound']"
      - uses: actions/upload-artifact@v4
        with:
          name: lacam-demo-${{ matrix.os }}
          path: |
            runs/lacam-demo.json
            runs/lacam-demo.progress.jsonl
            runs/lacam-demo.html
            runs/lacam-anytime.json
            runs/lacam-anytime.progress.jsonl
            runs/lacam-anytime.html
            runs/lacam-anytime.incumbents/
